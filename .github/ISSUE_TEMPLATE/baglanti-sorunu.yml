name: Connection problem / Bağlantı sorunu
description: A site does not open or it cannot connect / Bir site açılmıyor veya bağlanamıyor
labels: ["connection"]
body:
  - type: markdown
    attributes:
      value: |
        These details help me fix it quickly. Please do not include personal information (IP, username).
        Bu bilgiler sorunu hızlıca çözmemi sağlar. Kişisel bilgi (IP adresi, kullanıcı adı vb.) yazmayın.
  - type: input
    id: version
    attributes:
      label: Version / Sürüm
      placeholder: "1.3"
    validations:
      required: true
  - type: input
    id: isp
    attributes:
      label: ISP and connection type / İnternet servis sağlayıcısı ve bağlantı türü
      placeholder: "e.g. ISP name, fiber or mobile / ör. İSS adı, fiber veya mobil"
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Site or app that does not work / Açılmayan site veya uygulama
      placeholder: "discord.com"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: What happens? / Ne oluyor?
      options:
        - Cannot connect / Bağlanamıyorum
        - Says connected but the site does not open / Bağlı görünüyor ama site açılmıyor
        - Connected but not verified / Bağlı görünüyor ama doğrulanmadı
        - Drops after a while / Bağlantı bir süre sonra kopuyor
        - Other / Diğer
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Diagnostic summary / Tanılama özeti
      description: |
        In the app open Logs (top-right icon) → "Copy logs" and paste the result here.
        Uygulamada Kayıtlar (sağ üstteki simge) → "Kayıtları kopyala" düğmesine basıp çıktıyı buraya yapıştırın.
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else / Eklemek istedikleriniz
      description: Does it work on another network (e.g. phone hotspot)? / Başka bir ağda (ör. telefonun mobil erişim noktasında) durum nasıl?
