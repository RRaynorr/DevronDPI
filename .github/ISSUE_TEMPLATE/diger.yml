name: Suggestion or other / Öneri veya diğer
description: Feature idea, question or anything else / Özellik önerisi, soru veya başka bir konu
body:
  - type: markdown
    attributes:
      value: |
        Please do not include personal information (IP, username). If a site does not open, use the "Connection problem" form.
        Kişisel bilgi (IP adresi, kullanıcı adı vb.) yazmayın. Bir site açılmıyorsa "Connection problem / Bağlantı sorunu" formunu kullanın.
  - type: input
    id: version
    attributes:
      label: Version / Sürüm
      placeholder: "1.3"
  - type: textarea
    id: message
    attributes:
      label: Your message / Mesajınız
      description: Describe your idea, question or topic / Önerinizi, sorunuzu veya konuyu yazın
    validations:
      required: true
